services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: graduation_backend
    restart: unless-stopped
    volumes:
      # Mount thư mục lưu file wishes.db để dữ liệu không bị mất khi restart/rebuild
      - backend_data:/app/data
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: graduation_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # Mount mã nguồn Frontend tĩnh
      - ./frontend:/usr/share/nginx/html:ro
      # Mount cấu hình reverse proxy
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  backend_data:

networks:
  app_network:
    driver: bridge