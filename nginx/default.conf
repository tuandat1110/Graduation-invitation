server {
    listen 80;
    server_name localhost;

    # DNS resolver nội bộ mặc định của Docker
    resolver 127.0.0.11 valid=30s;

    # Phục vụ Frontend HTML tĩnh
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy các request /api sang Backend container
    location /api/ {
        # Đặt URL vào biến để Nginx chỉ resolve DNS khi có request thực tế phát sinh
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}