# Tự động chuyển HTTP sang HTTPS
server {
    listen 80;
    server_name tuandat1110.duckdns.org;

    return 301 https://$host$request_uri;
}

# Cấu hình HTTPS
server {
    listen 443 ssl;
    server_name tuandat1110.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/tuandat1110.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tuandat1110.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=30s;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}